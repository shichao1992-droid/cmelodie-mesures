<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>C'Mélodie · 尺寸卡 Fiches</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  /* 手机只读：顶部搜索 + 分类；照片卡片网格；点开是一张完整尺寸卡，可复制文字或打印 */
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#172334; --muted:#64748B; --line:#DDE2E8;
  --accent:#2563EB; --good:#2F7D4F; --warn:#B7791F;
  --font:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;flex:1}
.btn-s{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tools{display:flex;gap:8px;margin-top:8px}
.tools input,.tools select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tools select{flex:0 0 40%}
main{padding:12px 14px 40px;max-width:760px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;width:100%}
.ph{aspect-ratio:3/4;background:#EEF0F3;display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:8px 10px}
.card b{display:block;font-size:15px}
.card small{color:var(--muted);font-size:12px;display:block}
.card .k{font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:24px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.count{font-size:13px;color:var(--muted);margin:0 0 8px}
/* fiche */
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.fh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fh h2{margin:0;font-size:24px}
.fh .meta{color:var(--muted);font-size:13px}
.brand{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pics .ph{border-radius:10px;border:1px solid var(--line)}
.dia{background:#fff;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px}
.dia svg{width:100%;height:auto;max-height:100%}
.dia .val{font:700 15px Arial,sans-serif;fill:#E11D48;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.top2{display:grid;grid-template-columns:44% 1fr;gap:12px;margin:12px 0}
.top2 .ph{border-radius:10px;border:1px solid var(--line)}
.kv{display:grid;gap:6px;align-content:start;font-size:14px}
.kv b{font-size:16px}
.big{margin:8px 0 4px}
.big .dia{padding:8px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.thumbs button{flex:none;width:64px;padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:none}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700}
.sizes button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.l{width:34px}
td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.let{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.let.g{background:var(--ink)}
.comp{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;font-weight:700}
.btn.l{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.set h2{font-size:16px;margin:0 0 6px}
.set p{font-size:14px;color:var(--muted);margin:0 0 10px}
.set label{font-size:13px}
.set input.t{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:2px 0 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{
  header,.acts,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .fiche{border:0;padding:0}
  .pics{grid-template-columns:1fr 1fr}
}
</style>
</head>

/* 在示意图的字母旁边直接写尺寸 */
function annotate(r){

  r.ids.forEach(function(t){
    var box=document.querySelector('.dia[data-t="'+t+'"] svg');if(!box)return;
    var vb=(box.getAttribute("viewBox")||"0 0 400 430").split(/\s+/).map(Number),W=vb[2];
    fieldsOf(t,{elastic:r.elastic,sleeve:r.sleeve}).forEach(function(f){
      var v=r.m&&r.m[f.k];if(v==null)return;
      var g=box.querySelector('[data-field="'+f.k+'"]');if(!g)return;
      var c=g.querySelector("circle.tag");if(!c)return;
      var cx=+c.getAttribute("cx"),cy=+c.getAttribute("cy");
      var txt=document.createElementNS(NS,"text");
      var right=cx+13+58<=vb[0]+W;
      txt.setAttribute("x",right?cx+13:cx-13);txt.setAttribute("y",cy+5);
      txt.setAttribute("text-anchor",right?"start":"end");txt.setAttribute("class","val");
      txt.textContent=fmt(v)+" cm";g.appendChild(txt);
    });
  });
}

  var L=["C'Mélodie · "+tr("尺寸卡","Fiche mesures"),tr("款号：","Réf. : ")+g.ref,tr("分类：","Catégorie : ")+g.cat,tr("尺码：","Taille : ")+taille,tr("平铺尺寸（cm）：","Mesures à plat (cm) :")];
  rowsOf(r).forEach(function(x){L.push((x.let?x.let+" ":"• ")+tr(x.z,x.fr)+" : "+fmt(x.v)+" cm")});
  L.push(tr("净重：","Poids net : ")+r.poids+" g");
  tags.forEach(function(t){L.push(String(t).replace(/<[^>]+>/g,""))});
  L.push(tr("宽度为平铺半宽，围度 = 宽度 × 2","Largeurs à plat : tour = largeur × 2"));

  if($("pf"))$("pf").addEventListener("change",importPhotos);

function importPhotos(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
      var hi=rows.findIndex(function(r){return r.some(function(c){return /^(r[ée]f[ée]rence|ref|r[ée]f\.?)$/i.test(String(c).trim())})});
      if(hi<0)throw new Error(tr("找不到款号列（Référence）","Colonne Référence introuvable"));
      var H=rows[hi].map(function(c){return String(c).trim()});
      var ri=H.findIndex(function(c){return /^(r[ée]f[ée]rence|ref|r[ée]f\.?)$/i.test(c)});
      var map={},n=0;
      rows.slice(hi+1).forEach(function(r){
        var ref=String(r[ri]||"").trim();if(!ref)return;
        r.forEach(function(c){String(c).split(/[\s,;|]+/).forEach(function(u){if(/^https?:\/\/\S+\.(jpe?g|png|webp|gif)(\?\S*)?$/i.test(u)||/^https?:\/\/\S*(image|img|photo|media|cdn)\S*$/i.test(u)){(map[ref]=map[ref]||[]);if(map[ref].indexOf(u)<0&&map[ref].length<6){map[ref].push(u);n++}}})});
      });
      if(!n)throw new Error(tr("文件里没有找到图片链接","Aucun lien d’image trouvé"));
      photos=map;save("f.photos",photos);
      $("pinfo").textContent=Object.keys(map).length+tr(" 个款，共 "," réf., ")+n+tr(" 张照片。上传中…"," photos. Envoi…");
      var path="data/photos.json",body={at:Date.now(),map:map};
      getJson(path).catch(function(){}).then(function(){return api(path,{method:"PUT",body:JSON.stringify({message:"photos MC",content:b64e(JSON.stringify(body)),sha:shas[path]})})})
      .then(function(r){if(!r.ok)throw new Error(r.status===403||r.status===404?tr("这个 token 不能写入（只读）","Token en lecture seule"):"GitHub "+r.status);$("pinfo").textContent=Object.keys(map).length+tr(" 个款有照片，已同步给所有人"," réf. avec photo, envoyé à tous")})
      .catch(function(err){$("pinfo").textContent=tr("只保存在这台设备：","Gardé sur cet appareil seulement : ")+err.message});
    }catch(err){$("pinfo").textContent=err.message}
  };
  rd.readAsArrayBuffer(f);e.target.value="";
}
