<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C'Mélodie · Mesures</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  /* 手机单手操作：分类 → 款号 → 测量；三个页签固定在底部 */
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#172334; --muted:#64748B; --line:#DDE2E8;
  --accent:#2563EB; --accent-ink:#FFFFFF; --good:#2F7D4F; --warn:#B7791F;
  --font:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}.chip.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding:12px 14px;max-width:640px;margin:0 auto}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
nav.tabs button{border:0;background:none;padding:9px 4px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.seasons{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.seasons button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.seasons button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.item .tag{font-size:12px;color:var(--muted)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.cat b{display:block;font-size:15px}
.cat span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.done{border-color:var(--good)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.item b{flex:1}
.item small{color:var(--muted)}
.ok{color:var(--good);font-weight:700;font-size:14px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.h2{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:700;letter-spacing:.03em}
.empty{text-align:center;color:var(--muted);padding:24px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
/* form */
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.fhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.fhead b{font-size:22px}
.fhead span{font-size:13px;color:var(--muted)}
.dia{display:block;width:100%;max-width:230px;height:auto;margin:0 auto}
.fields{display:grid;gap:8px;margin-top:6px}
.fld{display:grid;grid-template-columns:30px 1fr 110px;align-items:center;gap:8px}
.let{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.let.g{background:var(--ink)}
.fld label{font-size:15px}
.fld label small{display:block;font-size:12px;color:var(--muted)}
.fld input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;background:var(--bg)}
.fld input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.fld.warn input{border-color:var(--warn)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px;font-size:14px}
.sw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sw button{border:0;background:var(--surface);padding:7px 14px;font-size:14px}
.sw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.msg{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 15%,transparent);display:none}
.msg.show{display:block}
.save{width:100%;margin-top:12px;border:0;border-radius:12px;padding:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.sec{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 6px}
.card p{font-size:14px;color:var(--muted);margin:0 0 10px}
.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--accent);color:#fff;font-weight:700;width:100%;margin-top:6px}
.btn.l{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
input.t{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
select.t{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

  <div class="hrow">
    <button class="back" id="back" hidden aria-label="返回">←</button>

    <span class="count" id="count"></span><span class="chip" id="sync"></span>

  <nav class="tabs">

    <button data-t="fiches">记录 Fiches</button>
    <button data-t="export">设置 Réglages</button>
  </nav>
</header>
<main id="main"></main>

function cfgOk(){return !!(cfg.repo&&cfg.token&&/^[^/]+\/[^/]+$/.test(cfg.repo))}
function setSync(c,t){var el=$("sync");el.className="chip"+(c?" "+c:"");el.textContent=t}
function api(path,opt){opt=opt||{};opt.headers={"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json"};
  return fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+path,opt)}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,""))))}
function slug(n){return (n||"anon").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u4e00-\u9fff]+/g,"-").replace(/^-|-$/g,"")||"anon"}
var busy=false,dirty=load("m2.dirty",false),shas={};
function stamp(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function getJson(path){return api(path+"?t="+Date.now()).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}).then(function(j){if(!j)return null;shas[path]=j.sha;return JSON.parse(b64d(j.content))})}
function putJson(path,obj,msg){
  return api(path,{method:"PUT",body:JSON.stringify({message:msg,content:b64e(JSON.stringify(obj)),sha:shas[path]})})
    .then(function(r){if(r.status===409||r.status===422){return getJson(path).then(function(){return api(path,{method:"PUT",body:JSON.stringify({message:msg,content:b64e(JSON.stringify(obj)),sha:shas[path]})})})}return r})
    .then(function(r){if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}).then(function(j){shas[path]=j.content.sha})}
function mergeIn(rec){var n=0;Object.keys(rec||{}).forEach(function(k){var a=store[k],b=rec[k];if(b&&(!a||(b.at||"")>(a.at||""))){store[k]=b;n++}});return n}
function pull(force){
  if(!cfgOk()){setSync("","本机");return Promise.resolve()}
  if(busy&&!force)return Promise.resolve();
  busy=true;setSync("","同步中…");
  return api("data?t="+Date.now()).then(function(r){if(r.status===404)return [];if(!r.ok)throw new Error(r.status===401?"token 不对":"GitHub "+r.status);return r.json()})
  .then(function(list){
    var files=(list||[]).filter(function(f){return /\.json$/.test(f.name)});
    return Promise.all(files.map(function(f){return getJson("data/"+f.name).then(function(o){return{name:f.name,o:o}})}));
  }).then(function(res){
    res.forEach(function(x){if(!x.o)return;
      if(x.name==="items.json"){if((x.o.at||0)>itemsAt){items=x.o.list||[];itemsAt=x.o.at;save("m2.items",items);save("m2.itemsAt",itemsAt)}}
      else mergeIn(x.o.recs);
    });
    save("m2.recs",store);rebuild();busy=false;
    setSync("ok","✓ "+stamp());
    if(!ui.key)render();else $("count").textContent=Object.keys(recs).length+" / "+items.length;
    if(dirty)return push();
  }).catch(function(e){busy=false;setSync("warn",e.message)});
}
function push(){
  if(!cfgOk()){setSync("","本机");return Promise.resolve()}
  if(!cfg.name){setSync("warn","未填名字");return Promise.resolve()}
  if(busy){dirty=true;save("m2.dirty",true);return Promise.resolve()}
  busy=true;dirty=false;setSync("","上传中…");
  var path="data/mesures-"+slug(cfg.name)+".json",mine={};
  Object.keys(store).forEach(function(k){if(store[k].by===cfg.name)mine[k]=store[k]});
  var p=shas[path]?Promise.resolve():getJson(path);
  return p.then(function(){return putJson(path,{name:cfg.name,recs:mine},"mesures "+cfg.name)})
  .then(function(){busy=false;setSync("ok","✓ "+stamp());if(dirty)return push();save("m2.dirty",false)})
  .catch(function(e){busy=false;dirty=true;save("m2.dirty",true);setSync("warn","未上传")});
}
function pushItems(){
  if(!cfgOk())return;
  getJson("data/items.json").catch(function(){}).then(function(){return putJson("data/items.json",{at:itemsAt,list:items},"清单 MC")})
  .then(function(){toast("清单已同步给所有手机")}).catch(function(){toast("清单上传失败，稍后再导入一次")});
}
setInterval(function(){if(document.visibilityState==="visible")pull()},60000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pull()});
window.addEventListener("online",function(){push()});

/* 事件 */
$("main").addEventListener("click",function(e){
  var c=e.target.closest("[data-c]");if(c){ui.cat=c.dataset.c;ui.q="";render();return}
  var k=e.target.closest("[data-k].item");if(k){ui.key=k.dataset.k;ui.draft=null;ui.fromSearch=k.dataset.src==="search";if(ui.fromSearch){var it0=itemBy(ui.key);ui.cat=it0?it0.cat:null}render();window.scrollTo(0,0);return}
  var ed=e.target.closest("[data-edit]");if(ed){ui.tab="saisie";ui.key=ed.dataset.edit;ui.draft=null;ui.cat=recs[ui.key].cat||(itemBy(ui.key)||{}).cat;ui.q="";render();window.scrollTo(0,0)}
});
$("back").addEventListener("click",function(){ui.draft=null;if(ui.key&&ui.fromSearch){ui.key=null;ui.cat=null;ui.fromSearch=false;render();return}if(ui.key)ui.key=null;else{ui.cat=null;ui.q=""}render()});
document.querySelectorAll("nav.tabs button").forEach(function(b){b.addEventListener("click",function(){ui.tab=b.dataset.t;ui.q="";if(b.dataset.t==="saisie"&&ui.tab==="saisie"&&!ui.key){}render();window.scrollTo(0,0)})});

window.__m={tplOf:tplOf,elast:elast,frText:frText,pull:function(){return pull(true)}};
render();
pull();
})();
</script>
</body>
</html>
